{% extends 'core/base.html' %}

{% block content %}
<div class="row mb-3">
    <div class="col-8">
        <h2>🏭 Zoznam strojov</h2>
    </div>
    <div class="col-4 text-end">
        <!-- Tlačidlo na pridanie stroja cez admina (pre rýchlosť) -->
        <a href="/admin/core/stroj/add/" class="btn btn-success">
            + Pridať stroj
        </a>
    </div>
</div>

<div class="row">
        {% for stroj in stroje %}
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card shadow-sm h-100">
            <div class="card-body text-center">
                <h1 class="display-4">⚙️</h1>
                <h4 class="card-title mt-2">{{ stroj.nazov }}</h4>
                <p class="text-muted">ID stroja: {{ stroj.id }}</p>
                <hr>
                <div class="d-grid gap-2">
                    <a href="/admin/core/stroj/{{ stroj.id }}/change/" class="btn btn-outline-primary btn-sm">
                        🔧 Upraviť / Údržba
                    </a>
                </div>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center mt-5">
        <p class="text-muted">Zatiaľ nemáš pridané žiadne stroje.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
