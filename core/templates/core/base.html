<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ERP Systém - Kovovýroba{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        /* HLAVNÝ KONTajner – okraje a max šírka */
        .app-container {
            max-width: 1200px;
            margin: 20px auto;       /* hore/dole 20px, vľavo/vpravo center */
            padding: 0 16px;         /* vnútorný odstup od kraja */
        }
        .version-badge {
            font-size: 0.8rem;
            color: #e9ecef;
            margin-left: 10px;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include "core/navbar.html" %}

    <!-- Hlavný obsah so spoločnými okrajmi -->
    <main class="app-container">
        <!-- horná lišta: názov + verzia -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 mb-0">
                {% block page_title %}{% endblock %}
            </h1>
            <span class="version-badge">Verzia: {{ APP_VERSION }}</span>
        </div>

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-light text-center py-3 mt-4">
        <div class="container">
            <small class="text-muted">© 2026 ERP Systém - Kovovýroba</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
