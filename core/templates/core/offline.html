<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline režim</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8f9fa;
      color: #212529;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
    }
    p {
      margin: 0 0 10px;
      line-height: 1.45;
    }
    .muted {
      color: #6c757d;
      font-size: 0.95rem;
    }
    .btn {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #0d6efd;
      color: #0d6efd;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📴 Ste offline</h1>
    <p>Aplikácia sa nepodarila načítať zo siete. Niektoré už navštívené stránky vedia fungovať aj bez internetu.</p>
    <p class="muted">Keď sa obnoví pripojenie, skúste stránku znovu načítať.</p>
    <a class="btn" href="/">🔄 Skúsiť znova</a>
  </div>
</body>
</html>
