{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>🔐 Prihlásenie do ERP</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <!-- Toto vypíše políčka meno a heslo automaticky -->
                    <div class="mb-3">
                        <label class="form-label">Meno:</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Heslo:</label>
                        {{ form.password }}
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 py-2">Prihlásiť sa</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Trochu CSS úpravy pre Django formulárové polia, aby vyzerali pekne v Bootstrape -->
<style>
    input[type="text"], input[type="password"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ced4da;
        border-radius: 4px;
    }
</style>
{% endblock %}
