version: '3.8'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: erp_system
    ports:
      - "8000:8000"
    volumes:
      - erp_media:/app/media
      - erp_db:/app
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=config.settings
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  erp_media:
    driver: local
  erp_db:
    driver: local