version: '3.8'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: erp_system
    ports:
      - "8000:8000"
    volumes:
      - erp_media:/app/media
      - erp_db:/data
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=config.settings
      - SQLITE_PATH=/data/db.sqlite3
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  erp_media:
    name: erp_media
    driver: local
  erp_db:
    name: erp_db
    driver: local