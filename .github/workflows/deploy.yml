name: CI + Deploy na NAS

# ─────────────────────────────────────────────────────────────────────────────
# Potrebné GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   NAS_HOST          – IP alebo Tailscale hostname NASu, napr. 192.168.1.94
#                       alebo Tailscale IP, napr. 100.64.x.x
#   NAS_USER          – SSH používateľ na NASe, napr.  Marek
#   NAS_SSH_KEY       – Obsah private SSH kľúča (~/.ssh/id_rsa)
#                       Verejný kľúč musí byť na NASe v ~/.ssh/authorized_keys
#   NAS_APP_PATH      – Cesta k projektu na NASe, napr. /volume1/docker/erp
#   TAILSCALE_AUTHKEY – (voliteľné) Auth key z https://login.tailscale.com/admin/settings/keys
#                       Potrebné iba ak je NAS dostupný len cez Tailscale VPN.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main

jobs:
  # ── 1. Testy ───────────────────────────────────────────────────────────────
  test:
    name: Spusti Django testy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Stiahni kód
        uses: actions/checkout@v4

      - name: Nastav Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Nainštaluj závislosti
        run: pip install -r requirements.txt

      - name: Skontroluj konfiguráciu Django
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Aplikuj migrácie
        run: python manage.py migrate --run-syncdb
        env:
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Spusti testy
        run: python manage.py test core --verbosity=2
        env:
          DJANGO_SETTINGS_MODULE: config.settings

  # ── 2. Deploy na NAS ───────────────────────────────────────────────────────
  deploy:
    name: Deploy na Synology NAS
    runs-on: ubuntu-latest
    needs: test          # spustí sa len ak testy prešli
    permissions:
      contents: read
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

    steps:
      - name: Pripoj sa cez Tailscale (ak je nastavený)
        # Preskočí tento krok, ak secret TAILSCALE_AUTHKEY nie je nastavený
        if: ${{ env.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}

      - name: Nastav SSH kľúč
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          python3 -c "import os,base64,pathlib,re; raw=os.environ.get('NAS_SSH_KEY','').strip(); assert raw,'NAS_SSH_KEY je prázdny alebo chýba.'; key=raw[1:-1] if len(raw)>=2 and raw[0]==raw[-1] and raw[0] in '\"\'' else raw; key=key.replace('\\\\n','\\n'); compact=''.join(key.split()); is_b64=('BEGIN ' not in key) and bool(re.fullmatch(r'[A-Za-z0-9+/=]+', compact)); decoded=base64.b64decode(compact + '='*((4-len(compact)%4)%4)).decode('utf-8','ignore') if is_b64 else key; key=decoded if ('BEGIN ' in decoded) else key; key=key.replace('\\r\\n','\\n').replace('\\r','\\n'); key=key if key.endswith('\\n') else key+'\\n'; pathlib.Path.home().joinpath('.ssh','id_ed25519').write_text(key, encoding='utf-8')"

          sed -i 's/\r$//' ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || (echo "NAS_SSH_KEY sa nedá načítať. Ulož celý private key (bez passphrase) alebo jeho base64 verziu." && exit 1)
          ssh-keyscan -H "${{ secrets.NAS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Otestuj SSH spojenie na NAS
        run: |
          echo "🔎 DNS/host diagnostika pre ${{ secrets.NAS_HOST }}"
          getent hosts "${{ secrets.NAS_HOST }}" || true
          echo "🔎 Test TCP portu 22"
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.NAS_HOST }}/22" && echo "✅ Port 22 je dostupný" || (echo "❌ Port 22 nie je dostupný" && exit 1)

          ssh -vv -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa \
              "${{ secrets.NAS_USER }}@${{ secrets.NAS_HOST }}" \
              "echo '✅ SSH spojenie funguje'"

      - name: Nasaď na NAS cez SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa \
              "${{ secrets.NAS_USER }}@${{ secrets.NAS_HOST }}" \
              "bash -s" << 'ENDSSH'
            set -euxo pipefail
            APP_PATH="${{ secrets.NAS_APP_PATH }}"

            echo "👤 User: $(whoami)"
            echo "🏠 Home: $HOME"
            echo "📍 Current dir: $(pwd)"
            echo "🧭 APP_PATH: $APP_PATH"

            if [ ! -d "$APP_PATH" ]; then
              echo "❌ NAS_APP_PATH neexistuje: $APP_PATH"
              exit 1
            fi

            echo "📂 Prechod do projektu: $APP_PATH"
            cd "$APP_PATH"

            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            elif docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              echo "❌ Nenašiel som docker-compose ani docker compose na NASe."
              exit 1
            fi
            echo "🐳 Použijem: $COMPOSE_CMD"

            echo "⬇️  Stiahnutie najnovšieho kódu z GitHubu..."
            git pull origin main

            echo "🔨 Build Docker image..."
            $COMPOSE_CMD build

            echo "🔄 Reštart kontajnerov..."
            $COMPOSE_CMD up -d

            echo "⏳ Čakanie na spustenie aplikácie..."
            for i in $(seq 1 12); do
              if $COMPOSE_CMD ps | grep -q "Up"; then
                echo "  ✓ Kontajner beží (pokus $i)"
                break
              fi
              echo "  … pokus $i/12, čakám 5 sekúnd..."
              sleep 5
            done

            echo "🗄️  Aplikovanie migrácií databázy..."
            $COMPOSE_CMD exec -T web python manage.py migrate --noinput

            echo "📦 Zbieranie statických súborov..."
            # || true: collectstatic môže zlyhať pri prvom behu kvôli právam, app to neblokuje
            $COMPOSE_CMD exec -T web python manage.py collectstatic --noinput || true

            echo ""
            echo "✅ Deployment dokončený!"
          ENDSSH

      - name: Zdravotná kontrola (health-check)
        run: |
          echo "🩺 Kontrola dostupnosti aplikácie..."
          STATUS="000"
          for i in $(seq 1 6); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
                      --max-time 10 \
                      "http://${{ secrets.NAS_HOST }}:8000/" || echo "000")
            echo "  pokus $i/6 → HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              break
            fi
            sleep 5
          done
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "⚠️  Aplikácia neodpovedá správne (status $STATUS). Skontroluj logy na NASe."
            exit 1
          fi
          echo "✅ Aplikácia beží na http://${{ secrets.NAS_HOST }}:8000"
